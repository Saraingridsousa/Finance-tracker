name: Validate demo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/privacy-check.mjs
      - name: Dependency audit (high severity gate)
        run: npm audit --audit-level=high
      - name: Install pinned browser-test tooling (CI only)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence
          if-no-files-found: ignore
