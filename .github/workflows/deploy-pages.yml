name: Deploy portfolio demo to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/privacy-check.mjs
      - name: Install pinned browser-test tooling (CI only)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs dist/screenshots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
